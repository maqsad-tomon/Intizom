    ];

    function getRandomColor(id) {
      return BOOK_COLORS[id % BOOK_COLORS.length];
    }

    function cleanWord(w) {
      return (w || '').toLowerCase().replace(/[^a-z0-9а-яёўқғҳʻʼo'g']/gi, '').trim();
    }

    function extractEventQuestions(content) {
      if (!content) return [];
      const cleaned = content.replace(/\s+/g, ' ');
      const startOffset = Math.floor(cleaned.length * 0.04);
      const mainBody = cleaned.substring(startOffset);

      const rawSentences = mainBody.split(/(?<=[.!?])\s+/);
      const qualitySentences = rawSentences.filter(s => {
        const words = s.split(/\s+/).filter(w => w.length > 2);
        return words.length >= 10 && words.length <= 40 && !s.includes('@') && !s.includes('http');
      });

      if (qualitySentences.length < 5) {
        return [
          {
            type: "Fikr tahlili",
            prompt: "Ushbu asardagi muallif ilgari surgan asosiy g‘oya, fakt yoki xulosalarni bayon eting.",
            targetFacts: cleaned.split(/\s+/).filter(w => w.length > 4).slice(0, 15).map(cleanWord),
            fullEvent: cleaned.substring(0, 300)
          }
        ];
      }

      const questions = [];
      const step = Math.max(1, Math.floor(qualitySentences.length / 5));

      const questionTemplates = [
        {
          label: "Mantiqiy yakun va g‘oya",
          text: (ctx) => `Muallif quyidagi fikrni bayon qiladi:\n«${ctx}...»\nUshbu mulohaza kitobda qanday mantiqiy xulosa yoki voqea bilan yakunlanadi?`
        },
        {
          label: "Sabab va oqibat tahlili",
          text: (ctx) => `Kitobdagi muhim qism:\n«${ctx}...»\nMuallif fikricha, ushbu holat qanday natijaga yoki oqibatga olib keladi?`
        },
        {
          label: "Asosiy qoida / Ta'rif",
          text: (ctx) => `Asardagi tushunchaga ko‘ra:\n«${ctx}...»\nBu yerda ilgari surilgan asosiy fakt yoki fikr nima edi?`
        },
        {
          label: "Faktlar va dalillar",
          text: (ctx) => `Muallif ta'kidlaganidek:\n«${ctx}...»\nUshbu jumlani kitobdagi haqiqiy faktlar bilan yakunlang:`
        },
        {
          label: "Xulosa va xarakteristika",
          text: (ctx) => `Ushbu parchaga e'tibor bering:\n«${ctx}...»\nKitobda bu holatdan keyin aynan nima yuz beradi yoki qanday yakun beriladi?`
        }
      ];

      for (let i = 0; i < 5; i++) {
        const sentence = qualitySentences[Math.min(qualitySentences.length - 1, i * step)];
        if (!sentence) continue;

        const words = sentence.split(/\s+/);
        const splitIndex = Math.floor(words.length * 0.45);
        const eventContext = words.slice(0, splitIndex).join(' ');
        const eventAnswer = words.slice(splitIndex).join(' ');

        const stopWords = ["bilan", "uchun", "hamda", "ammo", "lekin", "chunki", "faqat", "edi", "emas", "kerak", "ham", "yoki", "deb", "esa"];
        const targetFacts = words
          .slice(splitIndex)
          .map(cleanWord)
          .filter(w => w.length >= 4 && !stopWords.includes(w));

        const tmpl = questionTemplates[i % questionTemplates.length];

        questions.push({
          type: tmpl.label,
          prompt: tmpl.text(eventContext),
          targetFacts: targetFacts,
          fullEvent: sentence,
          eventAnswer: eventAnswer
        });
      }

      return questions;
    }

    function evaluateAnswerLocally(userText, questionObj) {
      const userWords = userText.split(/\s+/).map(cleanWord).filter(w => w.length >= 3);
      const targetFacts = questionObj.targetFacts || [];

      if (userWords.length < 3) {
        return {
          score: 10,
          verdict: "Juda qisqa yoki yetarli emas",
          praise: "Javobingiz juda qisqa yozilgan, fikrni to'liqroq bayon qiling.",
          missing: `Kitobdagi asl parcha: «${questionObj.fullEvent}»`
        };
      }

      let matchedCount = 0;
      const foundWords = [];

      targetFacts.forEach(fact => {
        const found = userWords.some(uw => uw.includes(fact) || fact.includes(uw));
        if (found && !foundWords.includes(fact)) {
          matchedCount++;
          foundWords.push(fact);
        }
      });

      const factRatio = targetFacts.length > 0 ? (matchedCount / targetFacts.length) : 0;
      let calculatedScore = 0;
      let verdict = "";
      let praise = "";
      let missing = "";

      if (matchedCount >= 3 || factRatio >= 0.45) {
        calculatedScore = Math.min(100, Math.round(75 + (factRatio * 25)));
        verdict = "A'lo darajada! To‘g‘ri tushungansiz";
        praise = `Kitobdagi asosiy mazmunni (${foundWords.slice(0, 4).join(', ')}) juda aniq ifodalab berdingiz.`;
        missing = `To‘liq kitob parchasi: «${questionObj.fullEvent}»`;
      } else if (matchedCount >= 1 || factRatio >= 0.2) {
        calculatedScore = Math.min(65, Math.round(40 + (factRatio * 30)));
        verdict = "Qisman to‘g‘ri, lekin detallar yetishmaydi";
        praise = `Mazmunning ayrim qismlarini to‘g‘ri ilg‘agansiz.`;
        missing = `Kitobdagi asl yakun: «${questionObj.eventAnswer}».`;
      } else {
        calculatedScore = 15;
        verdict = "Mazmunga to‘liq mos kelmadi";
        praise = "Kiritilgan javob kitobdagi aynan ushbu fikrga to‘g‘ri kelmadi.";
        missing = `Aslida kitobda quyidagicha keltirilgan: «${questionObj.fullEvent}»`;
      }

      return { score: calculatedScore, verdict, praise, missing };
    }

    // YAXSHILANGAN VA TABIIY FON TOVUSHLARI
    function buildAmbient(ctx, type, master) {
      let alive = true;
      const nodes = [], timers = [];
      const bus = ctx.createGain();
      bus.gain.setValueAtTime(0.01, ctx.currentTime);
      bus.connect(master);
      bus.gain.linearRampToValueAtTime(1, ctx.currentTime + 1);

      const noise = (brown, freq, gain) => {
        try {
          const len = ctx.sampleRate * 2, buf = ctx.createBuffer(1, len, ctx.sampleRate);
          const d = buf.getChannelData(0); let last = 0;
          for (let i = 0; i < len; i++) {
            const w = Math.random() * 2 - 1;
            if (brown) { last = (last + 0.02 * w) / 1.02; d[i] = last * 3; } else d[i] = w * 0.3;
          }
          const s = ctx.createBufferSource(); s.buffer = buf; s.loop = true;
          const f = ctx.createBiquadFilter(); f.type = 'lowpass'; f.frequency.value = freq;
          const g = ctx.createGain(); g.gain.value = gain;
          s.connect(f); f.connect(g); g.connect(bus); s.start(); nodes.push(s);
        } catch(e) {}
      };

      const tone = (freq, dur, vol) => {
        if (!alive) return;
        try {
          const o = ctx.createOscillator(), g = ctx.createGain(), t = ctx.currentTime;
          o.type = 'sine'; o.frequency.setValueAtTime(freq, t);
          g.gain.setValueAtTime(0.001, t);
          g.gain.linearRampToValueAtTime(vol, t + 0.05);
          g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
          o.connect(g); g.connect(bus); o.start(t); o.stop(t + dur + 0.1);
        } catch(e) {}
      };

      try {
        if (type === 'rain') {
          noise(false, 3000, 0.15);
          noise(true, 400, 0.4);
        } else if (type === 'fireplace') {
          // 1. Olovning past g'uvullashi (tabiiy olov foni)
          noise(true, 300, 0.55);

          // 2. Mayin o'tin chirsillashi (elektron tut-tut signallar o'rniga tabiiy mikrotortishuv)
          const crackle = () => {
            if (!alive) return;
            try {
              const bufferSize = Math.floor(ctx.sampleRate * (0.015 + Math.random() * 0.025));
              const buffer = ctx.createBuffer(1, bufferSize, ctx.sampleRate);
              const data = buffer.getChannelData(0);
              for (let i = 0; i < bufferSize; i++) {
                data[i] = (Math.random() * 2 - 1) * Math.exp(-i / (bufferSize * 0.25));
              }
              const crackleNode = ctx.createBufferSource();
              crackleNode.buffer = buffer;

              const filter = ctx.createBiquadFilter();
              filter.type = 'bandpass';
              filter.frequency.value = 1200 + Math.random() * 1800;
              filter.Q.value = 1.2;

              const gain = ctx.createGain();
              gain.gain.value = 0.08 + Math.random() * 0.12;

              crackleNode.connect(filter);
              filter.connect(gain);
              gain.connect(bus);

              crackleNode.start();
              nodes.push(crackleNode);
            } catch (e) {}

            timers.push(setTimeout(crackle, 70 + Math.random() * 260));
          };
          crackle();
        } else if (type === 'cafe') {
          noise(true, 500, 0.35);
        } else if (type === 'forest') {
          noise(true, 600, 0.25);
          const loop = () => {
            if (!alive) return;
            tone(2200 + Math.random() * 1200, 0.12, 0.02);
            timers.push(setTimeout(loop, 2500 + Math.random() * 3000));
          };
          loop();
        } else if (type === 'ocean') {
          noise(true, 550, 0.45);
        } else if (type === 'piano') {
          const notes = [261.63, 329.63, 392.0, 440.0, 523.25];
          const loop = () => {
            if (!alive) return;
            tone(notes[Math.floor(Math.random() * notes.length)], 2.5, 0.06);
            timers.push(setTimeout(loop, 2500 + Math.random() * 2500));
          };
          loop();
        } else {
          noise(true, 800, 0.5);
        }
      } catch(e) {}

      return {
        stop() {
          alive = false;
          timers.forEach(t => clearTimeout(t));
          try {
            bus.gain.linearRampToValueAtTime(0.001, ctx.currentTime + 0.2);
            setTimeout(() => {
              nodes.forEach(n => { try { n.stop(); } catch(e) {} });
              bus.disconnect();
            }, 250);
          } catch(e) {}
        }
      };
    }

        }, 700);

      }, [hydrated, user, goalTitle, goalDays, currentDay, dayTasks, completedDays, onboarded, themeKey, books, archive]);

      const fileInputRef = useRef(null);
      const t = THEMES[themeKey] || THEMES.obsidian;

      const handleSoundClick = (sndId) => {
        try {
          if (activeSound === sndId) {
            if (currentRef.current) currentRef.current.stop();
            currentRef.current = null;
            setActiveSound('none');
            return;
          }

          if (currentRef.current) {
            currentRef.current.stop();
            currentRef.current = null;
          }

          if (sndId === 'none') {
            setActiveSound('none');
            return;
          }

          const AC = window.AudioContext || window.webkitAudioContext;
          if (!ctxRef.current) {
            ctxRef.current = new AC();
            masterRef.current = ctxRef.current.createGain();
            masterRef.current.gain.value = volume;
            masterRef.current.connect(ctxRef.current.destination);
          }

          if (ctxRef.current.state === 'suspended') {
            ctxRef.current.resume();
          }

          currentRef.current = buildAmbient(ctxRef.current, sndId, masterRef.current);
          setActiveSound(sndId);
        } catch (err) {
          setActiveSound('none');
        }
      };

      useEffect(() => {
        if (masterRef.current && ctxRef.current) {
          try {
            masterRef.current.gain.setValueAtTime(volume, ctxRef.current.currentTime);
          } catch(e) {}
        }
      }, [volume]);

      const filteredBooks = useMemo(() => {
        if (!searchQuery.trim()) return books;
        return books.filter(b => (b.title && b.title.toLowerCase().includes(searchQuery.toLowerCase())) || (b.author && b.author.toLowerCase().includes(searchQuery.toLowerCase())));
      }, [books, searchQuery]);

      const wordsList = useMemo(() => {
        if (!selectedBook || !selectedBook.content) return [];
        let cleaned = selectedBook.content
          .replace(/\s+([.,!?:;»”’')\]])/g, '$1')
          .replace(/([«“‘(\[])\s+/g, '$1');

        return cleaned
          .split(/\s+/)
          .filter(w => {
            const trimmed = w.trim();
            if (!trimmed) return false;
            return !/^[-.,!?:;—–"'\(\)\[\]«»]+$/.test(trimmed);
          });
      }, [selectedBook]);

      const remainingWords = Math.max(0, wordsList.length - wordIndex);
      const estimatedTotalSeconds = Math.round((remainingWords / speedWPM) * 60);
      const estMinutes = Math.floor(estimatedTotalSeconds / 60);
      const estSeconds = estimatedTotalSeconds % 60;

      useEffect(() => {
        let interval = null;
        if (isTimerRunning && secondsLeft > 0) {
          interval = setInterval(() => setSecondsLeft(prev => prev - 1), 1000);
        } else if (secondsLeft === 0) {
          setIsTimerRunning(false);
          alert("Pomodoro fokus seansi yakunlandi!");
        }
        return () => clearInterval(interval);
      }, [isTimerRunning, secondsLeft]);

      useEffect(() => {
        let speedInterval = null;
        if (isReadingRunning && wordsList.length > 0) {
          const delay = (60 / speedWPM) * 1000 * chunkSize;
          speedInterval = setInterval(() => {
            setWordIndex(prev => {
              if (prev + chunkSize >= wordsList.length) {
                setIsReadingRunning(false);
                return Math.max(0, wordsList.length - 1);
              }
              return prev + chunkSize;
            });
          }, delay);
        }
        return () => clearInterval(speedInterval);
      }, [isReadingRunning, speedWPM, chunkSize, wordsList]);

      const currentTasks = dayTasks[currentDay] || [];
      const completedTasksCount = currentTasks.filter(tk => tk.done).length;
      const dayPercent = currentTasks.length > 0 ? Math.round((completedTasksCount / currentTasks.length) * 100) : 0;

      const toggleTask = (id) => {
        setDayTasks(prev => ({
          ...prev,
          [currentDay]: (prev[currentDay] || []).map(tk => tk.id === id ? { ...tk, done: !tk.done } : tk)
        }));
      };

      const addTask = () => {
        if (!newTaskText.trim()) return;
        const newTask = { id: Date.now(), text: newTaskText.trim(), done: false };
        setDayTasks(prev => ({
          ...prev,
          [currentDay]: [...(prev[currentDay] || []), newTask]
        }));
        setNewTaskText("");
      };

      const saveEditingTask = (id) => {
        if (!editingTaskText.trim()) return;
        setDayTasks(prev => ({
          ...prev,
          [currentDay]: (prev[currentDay] || []).map(tk => tk.id === id ? { ...tk, text: editingTaskText.trim() } : tk)
        }));
        setEditingTaskId(null);
        setEditingTaskText("");
      };

      const deleteTask = (id) => {
        setDayTasks(prev => ({
          ...prev,
          [currentDay]: (prev[currentDay] || []).filter(tk => tk.id !== id)
        }));
      };

      const saveGoalSettings = (e) => {
        e.preventDefault();
        const days = parseInt(tempDays, 10);
        if (!tempTitle.trim() || isNaN(days) || days < 1) return;
        setGoalTitle(tempTitle.trim());
        setGoalDays(days);
        if (currentDay > days) setCurrentDay(days);
        setIsGoalModalOpen(false);
      };

      const deleteBook = (id, e) => {
        if (e) e.stopPropagation();
        const bookToDelete = books.find(b => b.id === id);
        if (!confirm(`"${bookToDelete?.title || 'Ushbu'}" kitobini haqiqatdan ham kutubxonadan o‘chirmoqchimisiz?`)) return;
        
        const newBooks = books.filter(b => b.id !== id);
        setBooks(newBooks);
        if (selectedBook?.id === id) {
          setSelectedBook(newBooks[0] || null);
          setWordIndex(0);
          setCurrentQIndex(0);
          setUserAnswer("");
          setExamFeedback(null);
        }
      };

      const handlePdfUpload = async (e) => {
        const file = e.target.files[0];
        if (!file) return;
        setUploadProgress(10);
        try {
          const fileReader = new FileReader();
          fileReader.onload = async function () {
            try {
              const typedarray = new Uint8Array(this.result);
              const pdf = await pdfjsLib.getDocument(typedarray).promise;
              let fullText = "";
              
              for (let i = 1; i <= pdf.numPages; i++) {
                const page = await pdf.getPage(i);
                const textContent = await page.getTextContent();
                fullText += textContent.items.map(item => item.str).join(" ") + " ";
                setUploadProgress(Math.round((i / pdf.numPages) * 100));
              }

              const cleanText = fullText.replace(/\s+/g, ' ').trim() || "Matn o‘qilmadi.";
              const bookTitle = file.name.replace(/\.[^/.]+$/, "");
              
              const generatedQuestions = extractEventQuestions(cleanText);
              const newId = Date.now();

              const newBook = {
                id: newId,
                title: bookTitle,
                author: "Yuklangan asar",
                coverColor: getRandomColor(newId),
                content: cleanText,
                questions: generatedQuestions
              };

              setBooks(prev => [...prev, newBook]);
              setSelectedBook(newBook);
              setWordIndex(0);
              setCurrentQIndex(0);
              setUserAnswer("");
              setExamFeedback(null);
              setUploadProgress(null);
              e.target.value = "";
              alert(`"${bookTitle}" kitobi muvaffaqiyatli yuklandi!`);
            } catch (err) {
              setUploadProgress(null);
              alert("PDF o'qishda xatolik yuz berdi.");
            }
          };
          fileReader.readAsArrayBuffer(file);
        } catch (err) {
          setUploadProgress(null);
          alert("Faylni yuklashda xatolik!");
        }
      };

      const handleCheckAnswer = () => {
        if (!userAnswer.trim()) {
          alert("Iltimos, avval o'z javobingizni yozing!");
          return;
        }

        const currentQ = selectedBook.questions[currentQIndex];
        const result = evaluateAnswerLocally(userAnswer, currentQ);
        setExamFeedback(result);
      };

      const currentQList = selectedBook?.questions || [];

      const finishedDays = completedDays.filter(d => d <= goalDays);
      const doneCount = finishedDays.length;
      const remainCount = Math.max(0, goalDays - doneCount);
      const dayScore = (d) => {
        if (!completedDays.includes(d)) return 0;
        const list = dayTasks[d] || [];
        if (!list.length) return 1;
        return list.filter(x => x.done).length / list.length;
      };
      const scoreSum = finishedDays.reduce((a, d) => a + dayScore(d), 0);
      const overallPct = goalDays ? Math.round((scoreSum / goalDays) * 100) : 0;
      const fullDays = finishedDays.filter(d => dayScore(d) === 1).length;
      const isDayDone = completedDays.includes(currentDay);

      const toggleDayComplete = () => {
        if (isDayDone) { setCompletedDays(prev => prev.filter(d => d !== currentDay)); return; }
        const left = (dayTasks[currentDay] || []).filter(x => !x.done).length;
        if (left > 0 && !confirm(`${currentDay}-kunda ${left} ta vazifa bajarilmagan. Baribir yakunlaysizmi?`)) return;
        setCompletedDays(prev => [...prev, currentDay]);
        if (currentDay < goalDays) setCurrentDay(currentDay + 1);
      };

      const signIn = async () => {
        if (!cloudReady) { alert("Firebase sozlamalari to‘ldirilmagan."); return; }
        const provider = new firebase.auth.GoogleAuthProvider();
        provider.setCustomParameters({ prompt: 'select_account' });
        try { await firebase.auth().signInWithPopup(provider); }
        catch (e) {
          if (e.code === 'auth/popup-blocked') {
            try { await firebase.auth().signInWithRedirect(provider); return; } catch(e2) { e = e2; }
          }
          if (e.code === 'auth/popup-closed-by-user') return;
          alert("Kirishda xatolik: " + (e.code || e.message));
        }
      };

      const signOut = () => { if (confirm("Hisobdan chiqasizmi?")) firebase.auth().signOut(); };

      const startNewGoal = () => {
        setSetupTitle(""); setSetupDays(goalDays);
        setSetupTasks((dayTasks[1] || []).map(x => x.text).join("\n"));
        setCreatingNew(true);
      };

      const authButton = user ? (
        <button onClick={() => setActiveTab('profile')} title={user.email} className="flex items-center gap-1.5">
          {user.photoURL ? <img src={user.photoURL} referrerPolicy="no-referrer" className="w-6 h-6 rounded-full" /> : <i className="fa-solid fa-circle-user"></i>}
          {!syncError && <span className={`hidden sm:inline text-[10px] ${t.textSub}`}>☁ Bulutda</span>}
        </button>
      ) : (
        <button onClick={signIn} className={`text-[11px] font-bold px-2.5 py-1 rounded-full border ${t.border} ${t.textMain} flex items-center gap-1.5`}>
          <i className="fa-brands fa-google"></i> Kirish
        </button>
      );

      if (!onboarded || creatingNew) {
        const submitSetup = () => {
          const tasks = setupTasks.split('\n').map(x => x.trim()).filter(Boolean);
          const days = Math.min(365, Math.max(1, Number(setupDays) || 0));
          if (!setupTitle.trim()) { alert("Avval maqsadingizni yozing."); return; }
          if (!tasks.length) { alert("Kamida bitta vazifa yozing."); return; }
          if (creatingNew && goalTitle) {
            let tDone = 0, tTotal = 0;
            for (let d = 1; d <= goalDays; d++) { const l = dayTasks[d] || []; tTotal += l.length; tDone += l.filter(x => x.done).length; }
            setArchive(prev => [...prev, { id: Date.now(), title: goalTitle, days: goalDays, finished: doneCount, full: fullDays, pct: overallPct, tDone, tTotal, archivedAt: new Date().toISOString() }]);
          }
          const dt = {};
          for (let d = 1; d <= days; d++) dt[d] = tasks.map((text, i) => ({ id: d * 1000 + i + 1, text, done: false }));
          setGoalTitle(setupTitle.trim()); setGoalDays(days); setDayTasks(dt);
          setCompletedDays([]); setCurrentDay(1); setActiveTab('home'); setOnboarded(true); setCreatingNew(false);
        };
        return (
          <div className={`w-full h-full ${t.appBg} overflow-y-auto font-sans`}>
            <div className="max-w-lg mx-auto p-5 md:p-8 space-y-4">
              <div className="flex items-center justify-between">
                <h1 className={`text-xl font-black ${t.textMain}`}>Intizom</h1>
                {authButton}
              </div>
              <div className={`${t.cardBg} border ${t.border} p-5 rounded-3xl space-y-4 shadow-sm`}>
                <div>
                  <h2 className={`font-black text-base ${t.textMain}`}>{creatingNew ? "Yangi maqsad" : "Maqsad va vazifalar"}</h2>
                  <p className={`text-xs mt-1 ${t.textSub}`}>Boshlash uchun maqsad va kunlik vazifalarni yozing.</p>
                </div>
                <div className="space-y-1.5">
                  <label className={`text-xs font-bold ${t.textSub}`}>Maqsadingiz</label>
                  <input value={setupTitle} onChange={e => setSetupTitle(e.target.value)} placeholder="Masalan: 10 kunda yangi kitob o'qish"
                    className={`w-full p-3 rounded-xl border ${t.border} ${t.subtleBg} ${t.textMain} text-sm outline-none`} />
                </div>
                <div className="space-y-1.5">
                  <label className={`text-xs font-bold ${t.textSub}`}>Necha kunlik reja?</label>
                  <input type="number" min="1" max="365" value={setupDays} onChange={e => setSetupDays(e.target.value)}
                    className={`w-28 p-3 rounded-xl border ${t.border} ${t.subtleBg} ${t.textMain} text-sm outline-none`} />
                </div>
                <div className="space-y-1.5">
                  <label className={`text-xs font-bold ${t.textSub}`}>Har kungi vazifalar (har qatorga bittadan)</label>
                  <textarea rows="5" value={setupTasks} onChange={e => setSetupTasks(e.target.value)} placeholder={"20 daqiqa kitob o‘qish\n25 daqiqa fokus ishlash"}
                    className={`w-full p-3 rounded-xl border ${t.border} ${t.subtleBg} ${t.textMain} text-sm outline-none resize-none`} />
                </div>
                <button onClick={submitSetup} className={`w-full py-3 rounded-2xl text-sm font-bold shadow-md ${t.accent}`}>{creatingNew ? "Yangi maqsadni boshlash" : "Boshlash"}</button>
                {creatingNew && <button onClick={() => setCreatingNew(false)} className={`w-full py-2.5 rounded-2xl text-xs font-bold border ${t.border} ${t.textSub}`}>Bekor qilish</button>}
              </div>
            </div>
          </div>
        );
      }

      return (
        <div className={`w-full h-full ${t.appBg} flex flex-col overflow-hidden relative transition-colors duration-300 font-sans`}>
          
          <div className={`px-6 md:px-10 py-4 flex justify-between items-center border-b ${t.border} flex-shrink-0`}>
            <div className="flex items-center gap-2">
              <h1 className={`text-lg font-black tracking-tight ${t.textMain}`}>Intizom</h1>
              {authButton}
            </div>
            
            <div className={`flex items-center gap-1.5 p-1 rounded-full ${t.cardBg} border ${t.border}`}>
              {[
                { k: 'obsidian', color: 'bg-zinc-900 border border-zinc-600', title: 'Obsidian Qora' },
                { k: 'light', color: 'bg-white border border-slate-300', title: 'Yorug‘lik Oq' },
                { k: 'sepia', color: 'bg-[#e7d8be] border border-[#b89f78]', title: 'Sepia Qog‘oz' },
                { k: 'midnight', color: 'bg-blue-600', title: 'Midnight Ko‘k' },
                { k: 'emerald', color: 'bg-emerald-600', title: 'Zumrad Yashil' }
              ].map(item => (
                <button
                  key={item.k}
                  onClick={() => setThemeKey(item.k)}
                  title={item.title}
                  className={`w-4 h-4 rounded-full transition-transform ${item.color} ${
                    themeKey === item.k ? 'scale-125 ring-2 ring-blue-500 shadow' : 'opacity-60 hover:opacity-100'
                  }`}
                />
              ))}
            </div>
          </div>

          <div className="flex-1 overflow-y-auto no-scrollbar p-4 sm:p-6 space-y-4 max-w-xl md:max-w-3xl xl:max-w-4xl mx-auto w-full md:p-8">
            
            {activeTab === 'home' && (
              <div className="space-y-4">
                <div className={`${t.cardBg} border ${t.border} p-5 rounded-3xl space-y-3 shadow-sm`}>
                  <div className="flex justify-between items-center">
                    <span className={`text-xs font-bold uppercase tracking-wider ${t.textSub}`}>Maqsad statistikasi</span>
                    <span className={`text-sm font-black ${overallPct === 100 ? 'text-emerald-500' : t.accentText}`}>{overallPct}%</span>
                  </div>
                  <div className="grid grid-cols-2 gap-3">
                    <div className="rounded-2xl p-3 bg-emerald-500/10 border border-emerald-500/20">
                      <div className="text-2xl font-black text-emerald-500">{doneCount}</div>
                      <div className={`text-xs font-semibold ${t.textSub}`}>Yakunlangan kun (to‘liq: {fullDays})</div>
                    </div>
                    <div className={`rounded-2xl p-3 ${t.subtleBg} border ${t.border}`}>
                      <div className={`text-2xl font-black ${t.textMain}`}>{remainCount}</div>
                      <div className={`text-xs font-semibold ${t.textSub}`}>Qolgan kun</div>
                    </div>
                  </div>
                  <div className={`w-full h-2.5 rounded-full ${t.sliderBg} overflow-hidden`}>
                    <div className="h-full bg-emerald-500 transition-all duration-500" style={{ width: `${overallPct}%` }}></div>
                  </div>
                  <div className="flex flex-wrap gap-1.5">
                    {Array.from({ length: goalDays }, (_, i) => i + 1).map(d => (
                      <button key={d} onClick={() => setCurrentDay(d)} title={`${d}-kun`}
                        className={`w-6 h-6 rounded-md text-[9px] font-bold transition ${
                          completedDays.includes(d) ? (dayScore(d) === 1 ? 'bg-emerald-500 text-white' : dayScore(d) > 0 ? 'bg-amber-500 text-white' : 'bg-red-500/70 text-white') : `${t.subtleBg} ${t.textSub}`
                        } ${d === currentDay ? 'ring-2 ring-amber-400' : ''}`}>{d}</button>
                    ))}
                  </div>
                  <button onClick={toggleDayComplete}
                    className={`w-full py-3 rounded-2xl text-sm font-bold shadow-md flex items-center justify-center gap-2 ${isDayDone ? 'bg-emerald-500/15 text-emerald-500 border border-emerald-500/30' : t.accent}`}>
                    <i className={`fa-solid ${isDayDone ? 'fa-circle-check' : 'fa-flag-checkered'}`}></i>
                    {isDayDone ? `${currentDay}-kun yakunlandi (bekor qilish)` : `${currentDay}-kunni yakunlash`}
                  </button>
                  <button onClick={startNewGoal} className={`w-full py-2.5 rounded-2xl text-xs font-bold border ${t.border} ${t.textMain} flex items-center justify-center gap-2 hover:opacity-80`}>
                    <i className="fa-solid fa-rotate"></i> Maqsadni yangilash
                  </button>
                </div>

                <div className={`${t.cardBg} border ${t.border} p-5 rounded-3xl relative shadow-sm`}>
                  <div className="flex justify-between items-start mb-2">
                    <span className={`text-xs font-bold uppercase tracking-wider ${t.textSub}`}>Bosh Reja</span>
                    <button 
                      onClick={() => { setTempTitle(goalTitle); setTempDays(goalDays); setIsGoalModalOpen(true); }}
                      className={`text-xs font-semibold ${t.accentText} hover:opacity-80 transition`}
                    >
                      Tahrirlash
                    </button>
                  </div>

                  <h2 className={`font-bold text-sm leading-relaxed ${t.textMain}`}>
                    {goalTitle || "Maqsad belgilanmagan"}
                  </h2>

                  <div className="mt-4 pt-3 border-t border-black/5 flex items-center justify-between">
                    <div>
                      <div className={`text-xs ${t.textSub} font-medium`}>Reja muddati</div>
                      <div className={`text-sm font-bold ${t.textMain}`}>{currentDay}-kun <span className={`${t.textSub} font-normal`}>/ {goalDays} kun</span></div>
                    </div>
                    <div className="text-right">
                      <div className={`text-xs ${t.textSub} font-medium`}>Kunlik natija</div>
                      <div className={`text-sm font-black ${dayPercent === 100 ? 'text-emerald-500' : t.accentText}`}>
                        {dayPercent}%
                      </div>
                    </div>
                  </div>

                  <input
                    type="range"
                    min="1"
                    max={goalDays}
                    value={currentDay}
                    onChange={(e) => setCurrentDay(Number(e.target.value))}
                    className={`w-full mt-3 h-2 ${t.sliderBg} rounded-lg appearance-none cursor-pointer ${t.rangeAccent}`}
                  />
                </div>

                <div className={`${t.cardBg} border ${t.border} p-5 rounded-3xl space-y-3 shadow-sm`}>
                  <div className="flex justify-between items-center">
                    <h3 className={`text-xs font-bold tracking-tight uppercase ${t.textSub}`}>
                      {currentDay}-Kunning vazifalari
                    </h3>
                    <span className={`text-xs font-semibold ${t.textSub}`}>
                      {completedTasksCount} / {currentTasks.length}
                    </span>
                  </div>

                  <div className="space-y-2.5">
                    {currentTasks.length > 0 ? (
                      currentTasks.map(tk => (
                        <div 
                          key={tk.id} 
                          className={`flex items-center justify-between p-3 rounded-2xl border ${t.border} ${t.subtleBg} transition-all`}
                        >
                          {editingTaskId === tk.id ? (
                            <div className="flex gap-2 w-full">
                              <input
                                type="text"
                                value={editingTaskText}
                                onChange={(e) => setEditingTaskText(e.target.value)}
                                className={`flex-1 ${t.cardBg} text-sm px-3 py-2 rounded-xl border ${t.border} ${t.textMain} focus:outline-none`}
                                autoFocus
                              />
                              <button onClick={() => saveEditingTask(tk.id)} className="px-3 py-1.5 bg-emerald-500 text-white font-bold rounded-xl text-xs">
                                <i className="fa-solid fa-check"></i>
                              </button>
                            </div>
                          ) : (
                            <>
                              <div 
                                onClick={() => toggleTask(tk.id)}
                                className="flex items-center gap-3 flex-1 cursor-pointer select-none"
                              >
                                <div className={`w-5 h-5 rounded-full border flex items-center justify-center transition ${
                                  tk.done ? 'bg-emerald-500 border-emerald-500 text-white' : 'border-zinc-400'
                                }`}>
                                  {tk.done && <i className="fa-solid fa-check text-[10px] font-black"></i>}
                                </div>
                                <span className={`text-sm font-medium leading-snug ${
                                  tk.done ? `line-through ${t.textSub}` : t.textMain
                                }`}>
                                  {tk.text}
                                </span>
                              </div>
                              <div className="flex items-center gap-2 ml-2">
                                <button 
                                  onClick={() => { setEditingTaskId(tk.id); setEditingTaskText(tk.text); }}
                                  className={`${t.textSub} hover:${t.textMain} text-xs p-1.5`}
                                >
                                  <i className="fa-solid fa-pen"></i>
                                </button>
                                <button 
                                  onClick={() => deleteTask(tk.id)}
                                  className={`${t.textSub} hover:text-rose-500 text-xs p-1.5`}
                                >
                                  <i className="fa-solid fa-trash-can"></i>
                                </button>
                              </div>
                            </>
                          )}
                        </div>
                      ))
                    ) : (
                      <div className={`text-center py-4 text-sm ${t.textSub}`}>Bu kunga vazifalar belgilanmagan</div>
                    )}
                  </div>

                  <div className="flex gap-2 pt-1">
                    <input
                      type="text"
                      placeholder="Yangi vazifa..."
                      value={newTaskText}
                      onChange={(e) => setNewTaskText(e.target.value)}
                      onKeyDown={(e) => e.key === 'Enter' && addTask()}
                      className={`flex-1 ${t.subtleBg} border ${t.border} rounded-2xl px-4 py-2.5 text-sm ${t.textMain} placeholder:opacity-50 focus:outline-none`}
                    />
                    <button
                      onClick={addTask}
                      className={`px-5 py-2.5 rounded-2xl text-sm font-bold ${t.accent}`}
                    >
                      +
                    </button>
                  </div>
                </div>
              </div>
            )}

            {activeTab === 'profile' && (
              <div className="space-y-4">
                <div className={`${t.cardBg} border ${t.border} p-5 rounded-3xl space-y-3 shadow-sm`}>
                  <span className={`text-xs font-bold uppercase tracking-wider ${t.textSub}`}>Profil</span>
                  {user ? (

                        O‘z so‘zingiz bilan kitobdagi fikrni to‘liq davom ettiring yoki xulosalang:
                      </label>
                      <textarea
                        rows="4"
                        value={userAnswer}
                        onChange={(e) => setUserAnswer(e.target.value)}
                        placeholder="Kitob mazmunidan kelib chiqib, aniq fikr yoki faktni yozing..."
                        className={`w-full ${t.subtleBg} border ${t.border} rounded-2xl p-3.5 text-sm leading-relaxed ${t.textMain} focus:outline-none placeholder:opacity-40`}
                      />
                    </div>

                    <button
                      onClick={handleCheckAnswer}
                      className={`w-full py-3.5 rounded-2xl text-xs font-bold shadow-md flex items-center justify-center gap-2 ${t.accent}`}
                    >
                      <i className="fa-solid fa-check-double"></i>
                      <span>Javobni Tekshirish</span>
                    </button>

                    {examFeedback && (
                      <div className={`mt-3 p-4 rounded-2xl border ${
                        examFeedback.score >= 75 ? 'border-emerald-500/40 bg-emerald-500/10' :
                        examFeedback.score >= 40 ? 'border-amber-500/40 bg-amber-500/10' :
                        'border-rose-500/40 bg-rose-500/10'
                      } space-y-2.5 transition-all`}>
                        
                        <div className="flex justify-between items-center">
                          <span className={`text-xs font-black uppercase ${
                            examFeedback.score >= 75 ? 'text-emerald-400' :
                            examFeedback.score >= 40 ? 'text-amber-400' : 'text-rose-400'
                          }`}>
                            {examFeedback.verdict}
                          </span>
                          <span className="text-sm font-black font-mono">
                            {examFeedback.score} / 100 ball
                          </span>
                        </div>

                        <div className="text-xs space-y-1">
                          <span className="font-bold flex items-center gap-1.5 text-zinc-300">
                            <i className="fa-solid fa-circle-info text-amber-400"></i> Baholash xulosasi:
                          </span>
                          <p className={`text-xs leading-relaxed ${t.textMain}`}>{examFeedback.praise}</p>
                        </div>

                        <div className="text-xs space-y-1 pt-2 border-t border-black/10">
                          <span className="font-bold flex items-center gap-1.5 text-amber-400">
                            <i className="fa-solid fa-book-open"></i> Asl kitobdagi matn:
                          </span>
                          <p className={`text-xs leading-relaxed italic opacity-90 ${t.textMain}`}>
                            {examFeedback.missing}
                          </p>
                        </div>
                      </div>
                    )}

                  </div>
                ) : (
                  <div className="text-center py-12 text-sm text-zinc-500">Kitob tahlil qilinmoqda...</div>
                )}
              </div>
            )}

          </div>

          <div className={`h-16 mx-3 mb-3 md:w-[30rem] md:self-center rounded-3xl border ${t.border} ${t.cardBg} backdrop-blur-2xl flex justify-around items-center px-2 flex-shrink-0 z-20 shadow-2xl`}>
            {[
              { id: 'home', icon: 'fa-house', label: 'Asosiy' },
              { id: 'timer', icon: 'fa-stopwatch', label: 'Fokus' },
              { id: 'library', icon: 'fa-book-bookmark', label: 'Kutubxona' },
              { id: 'speed', icon: 'fa-bolt', label: 'Tez O‘qish' },
              { id: 'profile', icon: 'fa-user', label: 'Profil' },
            ].map(tab => (
              <button
                key={tab.id}
                onClick={() => setActiveTab(tab.id)}
                className={`flex flex-col items-center gap-1 transition px-3 py-1.5 rounded-2xl ${
                  activeTab === tab.id ? t.accentText + ' font-bold bg-gradient-to-b from-white/30 to-white/5 ring-1 ring-white/30 shadow-md' : `${t.textSub} hover:${t.textMain}`
                }`}
              >
                <i className={`fa-solid ${tab.icon} text-base`}></i>
                <span className="text-[10px] tracking-tight">{tab.label}</span>
              </button>
            ))}
          </div>

          {isGoalModalOpen && (
            <div className="absolute inset-0 bg-black/75 backdrop-blur-sm flex items-center justify-center p-5 z-50">
              <div className={`${t.cardBg} border ${t.border} w-full max-w-sm p-6 rounded-3xl space-y-4 shadow-2xl`}>
                <h3 className={`text-xs font-bold uppercase tracking-wider ${t.textSub}`}>Rejani Tahrirlash</h3>
                <form onSubmit={saveGoalSettings} className="space-y-3.5">
                  <div>
                    <label className={`text-xs ${t.textSub} uppercase font-bold block mb-1.5`}>Maqsad</label>
                    <input
                      type="text"
                      required
                      value={tempTitle}
                      onChange={(e) => setTempTitle(e.target.value)}
                      className={`w-full ${t.subtleBg} border ${t.border} rounded-2xl px-4 py-2.5 text-sm ${t.textMain} focus:outline-none`}
                    />
                  </div>
                  <div>
                    <label className={`text-xs ${t.textSub} uppercase font-bold block mb-1.5`}>Muddat (kunlar soni)</label>
                    <input
                      type="number"
                      min="1"
                      max="365"
                      required
                      value={tempDays}
                      onChange={(e) => setTempDays(e.target.value)}
                      className={`w-full ${t.subtleBg} border ${t.border} rounded-2xl px-4 py-2.5 text-sm ${t.textMain} focus:outline-none`}
                    />
                  </div>
                  <div className="flex gap-3 pt-2">
                    <button
                      type="button"
                      onClick={() => setIsGoalModalOpen(false)}
                      className={`flex-1 py-2.5 text-xs rounded-xl border ${t.border} ${t.textSub}`}
                    >
                      Bekor qilish
                    </button>
                    <button
                      type="submit"
                      className={`flex-1 py-2.5 text-xs font-bold rounded-xl ${t.accent}`}
                    >
                      Saqlash
                    </button>
                  </div>
                </form>
              </div>
            </div>
          )}

        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
