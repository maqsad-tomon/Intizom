name: Namoz Vaqti Bildirishnomasi

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

concurrency:
  group: namoz-bildirishnoma
  cancel-in-progress: false

jobs:
  check-and-notify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Repozitoriyni yuklash
        uses: actions/checkout@v4

      - name: Node.js sozlash
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Kutubxonalarni o'rnatish
        run: |
          [ -f package.json ] || npm init -y
          npm install firebase-admin --no-audit --no-fund

      - name: Tekshirish va bildirishnoma yuborish
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: node notify.js
