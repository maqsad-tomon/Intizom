name: Namoz Vaqti Bildirishnomasi

on:
  schedule:
    # Har 5 daqiqada avtomatik tekshiradi
    - cron: '*/5 * * * *'
  # GitHub panelidan qo'lda ham sinab ko'rish imkoniyati
  workflow_dispatch:

concurrency:
  group: namoz-bildirishnoma
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  check-and-notify:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Repozitoriyni yuklash
        uses: actions/checkout@v4

      - name: Node.js sozlash
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Kerakli kutubxonalarni o'rnatish
        run: |
          if [ ! -f package.json ]; then
            npm init -y
          fi
          npm install firebase-admin --no-audit --no-fund --prefer-offline

      - name: Tekshirish va bildirishnoma yuborish
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: node notify.js
